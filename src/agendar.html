<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendeFácil — Novo Agendamento</title>
</head>
<body>
    <header>
        <h1>AgendeFácil</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="agendar.html">Agendar Horário</a></li>
                <li><a href="admin.html">Painel Administrativo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Faça o seu Agendamento</h2>
            <p>Preencha os campos abaixo para reservar o seu horário com nossos profissionais.</p>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Informações do Cliente</legend>
                    
                    <div>
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                    </div>

                    <div>
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(62) 99999-9999">
                    </div>

                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Detalhes do Atendimento</legend>

                    <div>
                        <label for="servico">Escolha o Serviço:</label>
                        <select id="servico" name="servico" required>
                            <option value="">Selecione...</option>
                            <option value="corte">Corte de Cabelo (R$ 50,00)</option>
                            <option value="barba">Barba Completa (R$ 35,00)</option>
                            <option value="combo">Combo Corte + Barba (R$ 75,00)</option>
                        </select>
                    </div>

                    <div>
                        <label for="data">Data Desejada:</label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div>
                        <label for="horario">Horário:</label>
                        <input type="time" id="horario" name="horario" required>
                    </div>
                </fieldset>

                <button type="submit">Confirmar Agendamento</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AgendeFácil. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
